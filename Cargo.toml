[workspace]
resolver = "3"
members = ["crates/spaceport-cli", "crates/spaceport-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mx/spaceport"

[workspace.dependencies]
spaceport-core = { path = "crates/spaceport-core" }
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# Maintained fork of the deprecated serde_yaml, same API.
serde_norway = "0.9"

# The docker engine API, over the daemon socket.
bollard = "0.21"
futures-util = { version = "0.3", default-features = false }

axum = "0.8"
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = [
  "client",
  "client-legacy",
  "server",
  "server-auto",
  "service",
  "tokio",
  "http1",
  "http2",
] }
rcgen = "0.14"
# `ring` rather than the default `aws-lc-rs`: no cmake/nasm in the build.
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "logging",
  "std",
  "tls12",
] }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "signal",
  "sync",
  "time",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
  "ring",
  "logging",
  "tls12",
] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
