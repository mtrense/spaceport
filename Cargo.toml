[workspace]
resolver = "3"
members = ["crates/spaceport-cli", "crates/spaceport-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mtrense/spaceport"

[workspace.dependencies]
spaceport-core = { path = "crates/spaceport-core", version = "0.1.0" }
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
# Maintained fork of the deprecated serde_yaml, same API.
serde_norway = "0.9"
# Only for the ACME account credentials blob, which instant-acme hands over as
# an opaque `Serialize`.
serde_json = "1"

# The docker engine API, over the daemon socket.
bollard = "0.21"
futures-util = { version = "0.3", default-features = false }

# The state store. `bundled` so the build does not depend on a system sqlite,
# and so every host runs the version this was tested against.
rusqlite = { version = "0.40", features = ["bundled"] }
# Stamping records with the time they were written, and events with the time
# they happened — which is why it parses as well as formats: an event is read
# back at the other end of the stream.
time = { version = "0.3", default-features = false, features = [
  "std",
  "formatting",
  "parsing",
  "serde",
] }
# Only for `flock` on the state directory's lock file.
libc = "0.2"

axum = "0.8"
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = [
  "client",
  "client-legacy",
  "server",
  "server-auto",
  "service",
  "tokio",
  "http1",
  "http2",
] }
rcgen = "0.14"
# The ACME protocol itself — accounts, orders, challenges. Everything around it
# (serving the challenge, storing the certificate, deciding when to renew) is
# spaceport's. `ring` for the same reason as below; no `aws-lc-rs`.
instant-acme = { version = "0.8", default-features = false, features = [
  "hyper-rustls",
  "rcgen",
  "ring",
] }
# Reading `notAfter` off an issued certificate: the only thing that can say
# when it has to be renewed.
x509-parser = "0.18"
# Turning the PEM an ACME server issues into the DER rustls serves.
rustls-pemfile = "2"
# `ring` rather than the default `aws-lc-rs`: no cmake/nasm in the build.
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "logging",
  "std",
  "tls12",
] }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "signal",
  "sync",
  "time",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
  "ring",
  "logging",
  "tls12",
] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
