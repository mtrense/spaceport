name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Callable so that `release.yml` gates a tag on exactly these jobs rather
  # than on a copy of them that can drift.
  workflow_call:
  # An advisory is published against a dependency already on main, not against
  # a pull request. Without a clock, a new RUSTSEC lands silently and is first
  # seen by whoever happens to open the next PR — which is how a vulnerable h2
  # sat in the lockfile unnoticed.
  schedule:
    - cron: "17 6 * * 1"

# A new push to a branch makes the run in flight for that branch pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI never benefits from incremental artifacts, and they cost cache space.
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

permissions:
  contents: read

# Every `uses:` is pinned to a commit, never a tag or a branch: a tag is a
# label its owner can move, so `@v7` is a promise to run whatever that account
# pushes next. The version each sha belongs to is written beside it, because a
# sha alone tells a reader nothing about what needs bumping.
jobs:
  test:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (branch @ 2026-09-03)
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --all --check

      # `--locked` on both, so that what CI vetted is the lockfile cargo-deny
      # inspected and the lockfile the release builds. Without it a dependency
      # can publish a semver-compatible point release that runs here while the
      # lockfile still reads clean.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked

      - name: Test
        run: cargo test --workspace --all-features --locked

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (branch @ 2026-09-03)

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Built from source and pinned, rather than pulled as a release binary
      # from a third party: it is one more thing running over this checkout,
      # and the cache above keeps the compile off all but the first run.
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked --version 0.37.2

      # Flags live in `tarpaulin.toml`, so this measures what a laptop running
      # `cargo tarpaulin` measures. Informational for now — nothing here
      # fails on a percentage; add `--fail-under N` once the number has a floor
      # worth defending.
      - name: Coverage
        run: cargo tarpaulin

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # Also when the tests fail: the partial report is how you find out how
        # far the run got.
        if: always()
        with:
          name: coverage
          path: target/coverage
          # A run that died before tarpaulin wrote anything has already failed
          # for a better reason than a missing artifact.
          if-no-files-found: warn

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Advisories, licences, duplicate versions and source registries, all
      # from deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
