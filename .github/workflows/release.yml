name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

# Every `uses:` is pinned to a commit for the reason given in `ci.yml`, and it
# matters most here: this is the workflow that signs its name to the binaries
# people download, and it is the one job in the repository holding
# `contents: write`.
jobs:
  # A tag is not a promise that the commit under it was ever tested. Nothing
  # stops one being cut from a branch, from a commit that never reached main,
  # or from a main that is red — and until this job existed, none of fmt,
  # clippy, test or cargo-deny ran on the way to a published release.
  #
  # Called rather than copied so the gate cannot drift from the checks the
  # repository actually runs.
  check:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc builds run on the oldest runner image we support, so the
          # binary keeps the lowest glibc requirement we can manage.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          # musl builds are fully static and run anywhere, glibc version and
          # distro irrelevant.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (branch @ 2026-09-03)
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      # rusqlite's `bundled` feature compiles sqlite from source, so a
      # musl-targeting C compiler has to exist. Native to the runner's arch, so
      # this is not a cross-compile.
      - name: Install musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools

      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }} --package spaceport-cli

      - name: Package
        id: package
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="spaceport-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/spaceport" "dist/${name}/"
          strip "dist/${name}/spaceport"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          sha256sum "dist/${name}.tar.gz" > "dist/${name}.tar.gz.sha256"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Lets the next step ask GitHub to attest that these files came out of
      # this workflow, at this commit. The checksum beside a tarball travels
      # from the same pipeline as the tarball, so it catches a corrupted
      # download and nothing else; an attestation is the part a downloader can
      # actually verify against something they did not get from us.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
          # A tag ending in -rc.1, -beta.2, … goes out as a prerelease.
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
