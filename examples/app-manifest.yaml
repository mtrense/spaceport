schema_version: 1

source:        # one of build | image
  type: build
  dockerfile: Dockerfile
  context: .               # Reject anything outside of `.`
# image: strm/helloworld-http:latest

routing:
  hosts: [my-app.example.com, www.my-app.example.com]        # when hostname already registered, fail

container:
  port: 8080                    # Defaults to a single `EXPOSE` (tcp) in the image config
                                # (error if not present or more than one `EXPOSE`)
  health:
    readiness:          # omit entirely -> tcp connect to the route port
      type: http                # http|tcp|none   (`path` invalid unless `http`)
      path: /healthz            # required when `http`, no default
      interval: 1s              # default: `1s`
      initial_delay: 0s         # default: `0s`
      timeout: 5s               # default: `5s`
      failure_threshold: 30     # default: `30` — with the interval, how long an
                                # apply waits for a slow app before giving up
      success_threshold: 1      # default: `1`
    liveness:          # omit entirely -> spaceport never restarts an app whose
                       # container is still running. Unlike readiness, this has
                       # no default: a liveness check is a standing instruction
                       # to restart, and an app that never asked for one does
                       # not acquire it by being applied to a newer spaceport.
                       # A container that has *exited* is restarted either way.
      type: http                # http|tcp|none   (`none` means the same as
                                # leaving the whole block out)
      path: /healthz            # required when `http`, no default
      initial_delay: 10s        # default: `0s` — the grace after a start. The
                                # app has already passed its readiness check by
                                # then, but ready is not always warm.
      interval: 10s             # default: `1s`
      timeout: 5s               # default: `5s`
      failure_threshold: 3      # default: `30` — how many checks in a row have
                                # to fail before spaceport restarts the app.
                                # Lower than readiness usually wants: here it is
                                # how long a broken app goes on serving, not how
                                # long a slow one is given to start.
      success_threshold: 1      # default: `1`
  volumes:                      # volumes are kept when an app is deleted
    - name: data                # host path is calculated as <data-dir>/app-id/<volume-name>;
                                # letters, digits, hyphens and underscores only
      mount: /var/lib/my-app/data   # must be absolute, and not `/`
      read_only: false          # default: `false`
                                # The directory is created owned by the image's
                                # `USER` when that is a number. A `USER` given
                                # as a name cannot be resolved from outside the
                                # image, so the volume stays owned by root and
                                # spaceport says so at launch.
  secrets:                      # Not supported yet: this parses and is checked
                                # against `env` below, but applying an app that
                                # declares one is refused — there is nowhere to
                                # put the value. Sanitation is the job of the
                                # user.
    - DB_PASSWORD               # every declared secret must be interpolated by
                                # some `env` value, and every `{{...}}` must
                                # name a declared secret
  env:
    DATABASE_URL: postgres://user:{{DB_PASSWORD}}@db:5432/my-app
    ENVIRONMENT: production
