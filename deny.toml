# Supply-chain policy, enforced in CI by `cargo deny check`.
# See https://embarkstudios.github.io/cargo-deny/

[graph]
# Only the platforms we ship. Keeps windows/macos-only dependencies out of the
# advisory and license graph.
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-gnu",
  "aarch64-unknown-linux-musl",
]
all-features = false

[advisories]
version = 2
# Advisories with no fix available yet go here, one line each, with a reason.
ignore = [
  # rustls-pemfile is unmaintained; its parsing code now lives in
  # rustls-pki-types behind the `PemObject` trait. No security impact, but the
  # PEM reading in `acme::certificate` should move over. Drop this entry then.
  "RUSTSEC-2025-0134",
]

[licenses]
version = 2
# Permissive licences only, plus the two file-level copyleft ones (MPL-2.0,
# CDDL-style) that do not reach into our own source.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "OpenSSL",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8

[[licenses.clarify]]
# ring's licence is a bundle of ISC/MIT/OpenSSL that no SPDX expression in the
# crate metadata describes; the upstream LICENSE file is the authority.
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path/workspace dependencies legitimately use `*`-ish version requirements.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
